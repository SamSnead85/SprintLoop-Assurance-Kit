name: Release candidate (no publish)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install exact release runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          check-latest: false
          package-manager-cache: false
          token: ''
          mirror-token: ''
      - name: Require exact Node runtime
        run: node -e "if(process.versions.node!=='24.20.0')process.exit(1)"
      - name: Install from lockfile without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Test, scan, inventory, pack, and digest without publishing
        run: npm run release:dry-run
      - name: Record package release in job summary
        run: |
          {
            printf '%s\n\n' '## Unpublished GitHub-only release candidate'
            printf '%s\n\n' 'No npm package, release, container, or attestation was published.'
            printf '%s\n' '```json'
            cat artifacts/package-release.json
            printf '%s\n\n' '```'
            cat artifacts/release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"
