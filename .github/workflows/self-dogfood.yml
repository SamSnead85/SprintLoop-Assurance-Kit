name: Self dogfood

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golden-path:
    name: golden-path
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install exact dogfood runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          check-latest: false
          package-manager-cache: false
          token: ''
          mirror-token: ''
      - name: Require exact Node runtime
        run: node -e "if(process.versions.node!=='24.20.0')process.exit(1)"
      - name: Install without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Build receiver-bound public inputs
        id: inputs
        env:
          EXPECTED_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
          PROVIDER_INBOX: ${{ runner.temp }}/assurance-provider-inbox
          RECEIVER_ROOT: ${{ runner.temp }}/assurance-receiver
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse --verify HEAD)"
          tree_sha="$(git rev-parse --verify 'HEAD^{tree}')"
          mkdir -p "$RECEIVER_ROOT"
          node src/cli.mjs demo \
            --out "$PROVIDER_INBOX" \
            --candidate "$head_sha" \
            --tree-digest "$tree_sha" \
            --repository "$EXPECTED_REPOSITORY" \
            --environment self-test
          cp "$PROVIDER_INBOX/policy.json" "$RECEIVER_ROOT/policy.json"
          cp "$PROVIDER_INBOX/trust.json" "$RECEIVER_ROOT/trust.json"
          rm "$PROVIDER_INBOX/policy.json" "$PROVIDER_INBOX/trust.json" "$PROVIDER_INBOX/dossier.json"
          policy_digest="$(node src/cli.mjs document-digest --file "$RECEIVER_ROOT/policy.json")"
          trust_digest="$(node src/cli.mjs document-digest --file "$RECEIVER_ROOT/trust.json")"
          printf 'candidate=%s\ntree=%s\npolicy=%s\ntrust=%s\n' \
            "$head_sha" "$tree_sha" "$policy_digest" "$trust_digest" >> "$GITHUB_OUTPUT"
      - name: Materialize out-of-tree provider bundle
        id: bundle
        uses: ./materialize-bundle
        with:
          source: ${{ runner.temp }}/assurance-provider-inbox
          destination: ${{ runner.temp }}/assurance-bundle
          candidate-root: .
          candidate: ${{ steps.inputs.outputs.candidate }}
          policy: ${{ runner.temp }}/assurance-receiver/policy.json
          trust: ${{ runner.temp }}/assurance-receiver/trust.json
          expected-policy-digest: ${{ steps.inputs.outputs.policy }}
          expected-trust-digest: ${{ steps.inputs.outputs.trust }}
          expected-repository: ${{ github.server_url }}/${{ github.repository }}
          expected-environment: self-test
      # Local `uses: ./` proves the contract and topology only. It is not an
      # independently governed assurance decision about this Action's own source.
      - name: Invoke local composite action — positive contract smoke
        id: positive
        uses: ./
        with:
          candidate: ${{ steps.inputs.outputs.candidate }}
          candidate-root: .
          evidence-root: ${{ steps.bundle.outputs.evidence-root }}
          manifest: ${{ steps.bundle.outputs.manifest }}
          receipt: ${{ steps.bundle.outputs.receipt }}
          authorization: ${{ steps.bundle.outputs.authorization }}
          policy: ${{ runner.temp }}/assurance-receiver/policy.json
          trust: ${{ runner.temp }}/assurance-receiver/trust.json
          expected-policy-digest: ${{ steps.inputs.outputs.policy }}
          expected-trust-digest: ${{ steps.inputs.outputs.trust }}
          expected-repository: ${{ github.server_url }}/${{ github.repository }}
          expected-environment: self-test
          dossier: ${{ runner.temp }}/action-positive-dossier.json
      - name: Require positive PASS
        env:
          CONCLUSION: ${{ steps.positive.outputs.conclusion }}
        run: test "$CONCLUSION" = PASS
      - name: Invoke local composite action — adversarial receiver context
        id: adversarial
        continue-on-error: true
        uses: ./
        with:
          candidate: ${{ steps.inputs.outputs.candidate }}
          candidate-root: .
          evidence-root: ${{ steps.bundle.outputs.evidence-root }}
          manifest: ${{ steps.bundle.outputs.manifest }}
          receipt: ${{ steps.bundle.outputs.receipt }}
          authorization: ${{ steps.bundle.outputs.authorization }}
          policy: ${{ runner.temp }}/assurance-receiver/policy.json
          trust: ${{ runner.temp }}/assurance-receiver/trust.json
          expected-policy-digest: ${{ steps.inputs.outputs.policy }}
          expected-trust-digest: ${{ steps.inputs.outputs.trust }}
          expected-repository: https://example.invalid/substituted-repository
          expected-environment: substituted-environment
          dossier: ${{ runner.temp }}/action-adversarial-dossier.json
      - name: Require adversarial BLOCK
        env:
          OUTCOME: ${{ steps.adversarial.outcome }}
          ADVERSARIAL_DOSSIER: ${{ runner.temp }}/action-adversarial-dossier.json
        run: |
          test "$OUTCOME" = failure
          node -e "const d=require(process.env.ADVERSARIAL_DOSSIER);if(d.decision.conclusion!=='BLOCK')process.exit(1)"
      - name: Confirm no private material entered the workspace
        run: npm run scan:sensitive
